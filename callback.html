<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repository connection</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; background: #f6f8fa; color: #1f2328; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .box { text-align: center; max-width: 420px; padding: 32px; border: 1px solid #d0d7de; border-radius: 8px; background: #ffffff; box-shadow: 0 1px 2px rgba(31,35,40,0.04); }
        .spinner { width: 28px; height: 28px; border: 3px solid #d0d7de; border-top-color: #0969da; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 16px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .error { color: #cf222e; }
    </style>
</head>
<body>
    <div class="box">
        <div class="spinner" id="spinner"></div>
        <p id="message">Completing repository connection...</p>
    </div>

    <script>
        const BACKEND_URL = "http://127.0.0.1:8080";

        const params = new URLSearchParams(window.location.search);
        const code = params.get("code");
        const state = params.get("state");
        const messageEl = document.getElementById("message");

        function showError(text) {
            document.getElementById("spinner").style.display = "none";
            messageEl.className = "error";
            messageEl.textContent = text;
        }

        if (!BACKEND_URL || BACKEND_URL.includes("{{")) {
            showError("Backend URL is not configured.");
        } else if (!code || !state) {
            showError("Invalid authorization response.");
        } else {
            const url = new URL("/oauth/callback", BACKEND_URL);
            url.searchParams.set("code", code);
            url.searchParams.set("state", state);

            fetch(url.toString(), {
                method: "GET",
                headers: { "Accept": "application/json" },
            })
            .then(resp => {
                if (!resp.ok) {
                    return resp.text().then(text => { throw new Error(text); });
                }
                return resp.json();
            })
            .then(data => {
                if (data.redirect_url) {
                    window.location.replace(data.redirect_url);
                } else {
                    throw new Error("No redirect URL received");
                }
            })
            .catch(err => {
                console.error("Callback error:", err);
                showError("Unable to complete connection. Please try again.");
            });
        }
    </script>
</body>
</html>
